<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="habibiGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8A3" />
      <stop offset="35%" stop-color="#F5D061" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <linearGradient id="habibiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2238" />
      <stop offset="50%" stop-color="#071322" />
      <stop offset="100%" stop-color="#03080F" />
    </linearGradient>
    <linearGradient id="oceanTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4D6E" />
      <stop offset="100%" stop-color="#0B253A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Midnight Frame -->
  <rect width="512" height="512" rx="110" fill="url(#habibiBg)"/>
  
  <!-- Outer Gold Border -->
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="url(#habibiGold)" stroke-width="4" opacity="0.6"/>

  <!-- Sacred Geometry Geometric Ring -->
  <circle cx="256" cy="256" r="190" stroke="url(#habibiGold)" stroke-width="1.5" stroke-dasharray="6 6" fill="none" opacity="0.35"/>
  <circle cx="256" cy="256" r="175" stroke="#1B4D6E" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Glowing Crescent & Mosque Dome -->
  <g transform="translate(256, 240) scale(1.15)">
    <!-- Crescent Moon -->
    <path d="M -30 -110 C 50 -110 110 -50 110 30 C 110 110 50 170 -30 170 C -6 170 38 134 38 30 C 38 -74 -6 -110 -30 -110 Z" fill="url(#habibiGold)" filter="url(#glow)"/>

    <!-- Radiant 8-Point Star at Top -->
    <g transform="translate(48, -85) scale(0.6)">
      <polygon points="0,-30 8,-10 28,-18 16,2 32,18 10,18 0,38 -10,18 -32,18 -16,2 -28,-18 -8,-10" fill="#FFF4D0" filter="url(#glow)"/>
    </g>

    <!-- Mosque Dome Silhouette -->
    <path d="M -60 120 C -60 60 -10 10 0 -30 C 10 10 60 60 60 120 Z" fill="url(#oceanTeal)" opacity="0.85"/>
    <path d="M -45 120 C -45 75 -8 30 0 0 C 8 30 45 75 45 120 Z" fill="url(#habibiGold)" opacity="0.9"/>
  </g>

  <!-- Typography: HABIBI SANCTUARY -->
  <text x="256" y="440" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#F5D061" letter-spacing="6" text-anchor="middle">HABIBI</text>
  <text x="256" y="468" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#94A3B8" letter-spacing="4" text-anchor="middle">ALOHA × FIRDAWS</text>
</svg>
