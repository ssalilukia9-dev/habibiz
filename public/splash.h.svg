<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="100%" height="100%">
  <defs>
    <!-- Background Watercolor Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Deep Indigo & Sapphire Watercolor Wash -->
    <radialGradient id="topWash" cx="50%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#2563EB" stop-opacity="0.55"/>
      <stop offset="75%" stop-color="#0284C7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bottomWash" cx="45%" cy="88%" r="65%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#1E3A8A" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#0284C7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold Foil Vein Gradient -->
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="25%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="75%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Calligraphy Black Ink Filter -->
    <filter id="inkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <filter id="goldShimmer" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="1500" fill="url(#bgGrad)"/>

  <!-- Top Blue / Indigo Watercolor Nebula -->
  <path d="M 0 0 Q 300 120 550 50 T 1000 0 L 1000 380 Q 750 450 500 320 T 0 340 Z" fill="url(#topWash)"/>
  
  <!-- Top Gold Leaf Accents -->
  <path d="M 200 40 Q 380 180 620 110 T 880 200" fill="none" stroke="url(#goldFoil)" stroke-width="12" opacity="0.8" stroke-linecap="round" filter="url(#goldShimmer)"/>
  <path d="M 120 120 Q 300 240 500 190 T 800 260" fill="none" stroke="url(#goldFoil)" stroke-width="6" opacity="0.6" stroke-linecap="round"/>

  <!-- Bottom Blue / Navy Watercolor Splashes -->
  <path d="M 0 1100 Q 250 950 550 1120 T 1000 1020 L 1000 1500 L 0 1500 Z" fill="url(#bottomWash)"/>
  
  <!-- Bottom Gold Veins -->
  <path d="M 80 1350 Q 340 1180 680 1280 T 950 1190" fill="none" stroke="url(#goldFoil)" stroke-width="14" opacity="0.85" stroke-linecap="round" filter="url(#goldShimmer)"/>
  <path d="M 180 1420 Q 420 1300 750 1380" fill="none" stroke="url(#goldFoil)" stroke-width="8" opacity="0.7" stroke-linecap="round"/>

  <!-- Sacred Center Ayat Al-Kursi Calligraphy Composition -->
  <g transform="translate(500, 680)" filter="url(#inkGlow)">
    
    <!-- Outer Sacred Calligraphy Ring -->
    <circle cx="0" cy="0" r="320" fill="none" stroke="url(#goldFoil)" stroke-width="3" opacity="0.4"/>
    <circle cx="0" cy="0" r="305" fill="none" stroke="#0F172A" stroke-width="1.5" opacity="0.2"/>

    <!-- Central Thuluth Allah Emblem (Top Crown) -->
    <text x="0" y="-230" text-anchor="middle" font-family="'Amiri', 'Traditional Arabic', 'Scheherazade New', serif" font-size="140" font-weight="bold" fill="#0A0F1D">
      اللَّهُ
    </text>

    <!-- Ayat al-Kursi Main Circular Complex Thuluth Glyph Composition -->
    <!-- Beautiful Authentic Classical Script Lines -->
    <g fill="#0A0F1D" text-anchor="middle" font-family="'Amiri', 'Scheherazade New', 'Noto Naskh Arabic', serif">
      
      <!-- Primary Central Majesty: La Ilaha Illa Huwa Al-Hayyul Qayyum -->
      <text x="0" y="-80" font-size="74" font-weight="bold" letter-spacing="2">
        لَا إِلَٰهَ إِلَّا هُوَ
      </text>

      <text x="0" y="10" font-size="78" font-weight="bold" letter-spacing="3">
        الْحَيُّ الْقَيُّومُ
      </text>

      <!-- Second Tier: La Ta'khudhuhu Sinatun Wa La Nawm -->
      <text x="0" y="90" font-size="52" font-weight="bold" letter-spacing="1">
        لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ
      </text>

      <!-- Third Tier: Lahu Ma Fis-Samawati Wa Ma Fil-Ard -->
      <text x="0" y="160" font-size="44" font-weight="bold">
        لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ
      </text>

      <!-- Fourth Tier: Man Dhal-Ladhi Yashfa'u 'Indahu Illa Bi-Idhnih -->
      <text x="0" y="220" font-size="34" font-weight="600" opacity="0.95">
        مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ
      </text>

      <!-- Bottom Crest Arc: Ya'lamu Ma Bayna Aydihim Wa Ma Khalfahum -->
      <text x="0" y="270" font-size="28" font-weight="600" opacity="0.85">
        يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ
      </text>
    </g>

    <!-- Shimmering Gold Accent Dust around Calligraphy -->
    <circle cx="-180" cy="-120" r="4" fill="#F59E0B" opacity="0.8" filter="url(#goldShimmer)"/>
    <circle cx="190" cy="-140" r="5" fill="#FBBF24" opacity="0.9" filter="url(#goldShimmer)"/>
    <circle cx="-220" cy="110" r="4" fill="#F59E0B" opacity="0.7"/>
    <circle cx="210" cy="130" r="5" fill="#FBBF24" opacity="0.8"/>
    <circle cx="0" cy="-330" r="6" fill="#F59E0B" opacity="0.9" filter="url(#goldShimmer)"/>
  </g>

  <!-- Bottom Sacred Inscription Text -->
  <text x="500" y="1420" text-anchor="middle" font-family="'Cinzel', 'Trajan Pro', serif" font-size="14" font-weight="700" letter-spacing="8" fill="#1E3A8A" opacity="0.8">
    AYAT AL-KURSI &bull; THE THRONE VERSE
  </text>
</svg>
